name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $tag = "v$version" }
          $installers = Get-ChildItem release\*.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' }
          if (-not $installers) { throw 'Windows installer was not created.' }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
            $release = Invoke-RestMethod -Uri $releaseUrl -Method Get -Headers $headers
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $releaseBody = @{
              tag_name = $tag
              name = "GTA VI: The Marathon $tag"
              generate_release_notes = $true
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Method Post -Headers $headers -ContentType 'application/json' -Body $releaseBody
          }
          $uploadBaseUrl = $release.upload_url.Substring(0, $release.upload_url.IndexOf('{'))
          $existingAssets = @($release.assets | ForEach-Object { $_.name })
          foreach ($installer in $installers) {
            if ($existingAssets -contains $installer.Name) { continue }
            $assetName = [uri]::EscapeDataString($installer.Name)
            Invoke-RestMethod -Uri "${uploadBaseUrl}?name=$assetName" -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $installer.FullName
          }
