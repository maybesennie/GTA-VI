name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $tag = "v$version" }
          $installers = Get-ChildItem release\*.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' }
          if (-not $installers) { throw 'Windows installer was not created.' }
          $files = $installers | ForEach-Object { "release/$($_.Name)" }
          gh release create "$tag" @files --generate-notes --title "GTA VI: The Marathon $tag"
